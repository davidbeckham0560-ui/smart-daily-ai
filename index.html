<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><title>Smart Daily AI Pro</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#090b13;--p:#141a29;--l:#303951;--t:#f5f6ff;--m:#aab3c9;--v:#9580ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#29204d,transparent 35%),var(--bg);color:var(--t);font-family:system-ui,"Noto Sans Bengali",sans-serif;min-height:100vh}.top{height:66px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 17px;gap:12px}.logo{background:linear-gradient(130deg,#9580ff,#42d6c5);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:25px}.brand{font-weight:800}.brand small{display:block;color:var(--m);font-size:10px;letter-spacing:1px}.status{margin-left:auto;color:#54ddc9;font-size:12px}main{max-width:800px;margin:auto;padding:24px 15px 180px}.welcome{text-align:center;padding:32px 8px}.orb{margin:auto auto 15px;width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#6757c7,#238f94);display:grid;place-items:center;font-size:36px}h1{font-size:26px;margin:0 0 8px}.sub{color:var(--m);font-size:14px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:22px auto}.suggestion{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:14px;color:var(--t);text-align:left;font:inherit}.suggestion b{display:block;font-size:13px}.suggestion span{font-size:11px;color:var(--m)}.msg{display:flex;gap:9px;margin:15px 0;align-items:flex-start}.avatar{width:32px;height:32px;border-radius:11px;background:#29234d;display:grid;place-items:center;flex-shrink:0}.bubble{background:var(--p);border:1px solid var(--l);padding:12px 14px;border-radius:5px 15px 15px;max-width:85%;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user{justify-content:flex-end}.user .bubble{background:#29234d;border-radius:15px 5px 15px 15px}.preview{max-width:180px;max-height:170px;display:block;border-radius:12px;margin-bottom:7px}.wrap{position:fixed;bottom:0;left:0;right:0;padding:12px 13px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#090b13 20%)}.composer{max-width:770px;margin:auto;background:#151b2b;border:1px solid #3b4561;border-radius:20px;padding:10px}.attach{background:#252d43;border:1px solid var(--l);color:#e5e7ff;border-radius:10px;padding:7px 10px;font-size:12px}#file{display:none}#prompt{width:100%;background:transparent;border:0;outline:0;color:var(--t);font:inherit;padding:12px 5px;resize:vertical;min-height:54px}.bar{display:flex;align-items:center;gap:8px}.bar small{color:var(--m);font-size:10px;flex:1}.send{background:linear-gradient(120deg,var(--v),#4b9fff);border:0;color:white;border-radius:12px;padding:11px 17px;font-weight:800}.notice{text-align:center;color:var(--m);font-size:10px;margin:7px auto 0}@media(max-width:400px){h1{font-size:23px}.suggestions{gap:7px}.suggestion{padding:10px}}
</style></head><body><header class="top"><div class="logo">✦</div><div class="brand">SMART DAILY AI<small>PRO · ONE AI CHAT</small></div><div class="status">● Ready</div></header><main id="chat"><section class="welcome" id="welcome"><div class="orb">✧</div><h1>কী করতে চান আজ?</h1><div class="sub">প্রশ্ন করুন, ছবি দিন, অথবা আপনার আইডিয়া লিখুন।</div><div class="suggestions"><button class="suggestion" onclick="fill('এই ছবিটা আরও সুন্দর করে এডিট করো')"><b>🖼️ ছবি এডিট</b><span>ছবি দিয়ে নির্দেশনা দিন</span></button><button class="suggestion" onclick="fill('এই ছবিটি দিয়ে একটি ভিডিও তৈরি করো')"><b>🎬 ছবি থেকে ভিডিও</b><span>ছবিকে ভিডিওতে রূপ দিন</span></button><button class="suggestion" onclick="fill('কৃত্রিম বুদ্ধিমত্তা কী? সহজ করে বুঝিয়ে বলো')"><b>💬 যেকোনো প্রশ্ন</b><span>সহজ ভাষায় উত্তর</span></button><button class="suggestion" onclick="fill('আমাকে একটি নতুন ব্যবসার আইডিয়া দাও')"><b>💡 নতুন আইডিয়া</b><span>লেখা ও পরিকল্পনায় সাহায্য</span></button></div></section></main><div class="wrap"><div class="composer"><label class="attach" for="file">＋ ছবি যোগ করুন</label><input id="file" type="file" accept="image/*"><span id="picked" style="font-size:11px;color:#54ddc9"></span><textarea id="prompt" rows="2" placeholder="এখানে মেসেজ লিখুন..."></textarea><div class="bar"><small>এক চ্যাটে সব কাজ · AI সংযোগ প্রয়োজন</small><button class="send" onclick="send()">পাঠান ↑</button></div></div><div class="notice">বাস্তব AI উত্তর, ছবি এডিট ও ভিডিও তৈরির জন্য AI সার্ভার/API সংযোগ লাগবে।</div></div><script>
let chosen=null;const $=id=>document.getElementById(id),chat=$('chat');function fill(s){$('prompt').value=s;$('prompt').focus()}$('file').onchange=()=>{chosen=$('file').files[0]||null;$('picked').textContent=chosen?' · '+chosen.name:''};function msg(s,user,img){let r=document.createElement('div');r.className='msg '+(user?'user':'');let a=document.createElement('div');a.className='avatar';a.textContent=user?'👤':'✦';let b=document.createElement('div');b.className='bubble';if(img){let i=document.createElement('img');i.className='preview';i.src=img;b.append(i)}let t=document.createElement('div');t.textContent=s;b.append(t);if(user){r.append(b,a)}else{r.append(a,b)}chat.append(r);chat.scrollTop=chat.scrollHeight}function send(){let s=$('prompt').value.trim();if(!s&&!chosen)return;$('welcome')?.remove();let img=chosen?URL.createObjectURL(chosen):null;msg(s||'এই ছবিটি দেখো',true,img);$('prompt').value='';chosen=null;$('file').value='';$('picked').textContent='';msg('চ্যাট ইন্টারফেস প্রস্তুত। বাস্তব AI উত্তর, ছবি এডিট ও ভিডিও তৈরি চালু করতে নিরাপদ AI সার্ভার/API সংযুক্ত করতে হবে। এই ডেমো এখনো ছবি পরিবর্তন বা ভিডিও তৈরি করছে না।',false)}$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
